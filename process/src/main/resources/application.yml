# LOCAL
server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: process
    env: dev
    buildFile: /app
  data:
    redis:
      ssl:
        enabled: false
      host: ${SPRING_REDIS_URL}
      port: ${SPRING_REDIS_PORT}
      timeout: 1000 #milliseconds - fail fast if Redis is slow/hung; getFromCache falls back to DB
      lettuce:
        pool:
          max-idle: 200
          max-active: 200
          min-idle: 200
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

spring.artemis:
  mode: native
  broker-url: ${SPRING_ARTEMIS_BROKER_URL}
  user: ${SPRING_ARTEMIS_USER}
  password: ${SPRING_ARTEMIS_PASSWORD}
  timeout: 10000 #milliseconds
  concurrency:
    my-queue: 2
    reconQueue: 1
    dailyReconQueue: 2
    conStatusUpdateQueue: 2
    accPostingQueue: 2
    penLatePaymentQueue: 2
    caseModuleReceiveQueue: 2
    casePrecQueue: 2
    pymGovShareNewInQueue: 2
    reconResubmitQueue: 2
    aremaResponseQueue: 2
  outQueueWaitingTimeout: 32000
  outQueueLoopingCount: 20
  outQueueWaitTime: 1
  outQueueDelay: 5000
  subQueueDelay: 1000
  name:
    reconQueue: PYM_RECON_IN_LOCAL
    dailyReconQueue: PYM_DAILY_RECON_LOCAL
    conStatusUpdateQueue: CON_PAYMENT_STATUS_UPDATE_IN_LOCAL
    accPostingQueue: ACC_AJE_IN_LOCAL
    penLatePaymentQueue: PEN_CALCULATE_IN_LOCAL
    caseModuleTriggerQueue: CAS_CASE_IN
    auditTrailQueue: AUD_REQ_IN_LOCAL
    myTaskInQueue: REG_USR_TASK_IN_LOCAL
    cancellationQueue: CON_CANCEL_CONTRIBUTION_IN_LOCAL
    caseModuleReceiveQueue: PYM_CASE_IN_LOCAL
    caseResubmitQueue: CAS_RESUBMIT_IN_LOCAL
    dmsQueue: DMS_IN_LOCAL
    itemEditable: CON_PAYMENT_MISMATCH_IN_LOCAL
    autoCloseCaseQueue: CAS_CLOSE_IN_LOCAL
    manualLinkCaseQueue: CAS_LINK_IN_LOCAL
    caseCloseQueue: CAS_CLOSE_IN_LOCAL
    caseActivityQueue: CAS_ACTIVITY_IN_LOCAL
    casePrecQueue: PYM_PREC_IN_LOCAL
    penaltyUpdateStatusQueue: PEN_UPDATE_IN_LOCAL
    emailNoftQueue: NTF_MSG_IN_LOCAL
    pymGovShareNewInQueue: PYM_GOV_SHARE_NEW_IN_LOCAL
    govPaymentUpdateStatusQueue: PYM_GOV_STATUS_UPDATE_IN_LOCAL
    aremaResponseQueue: PYM_AREMA_IN_LOCAL
    conUnpaidQueue: CON_UNPAID_CONTRIBUTION_IN_LOCAL
    reconResubmitQueue: PYM_RECON_RESUBMIT_IN_LOCAL
    pymKwspFileExceptionQueue: PYM_KWSP_FILE_EXCEP_IN_LOCAL
    caseUserTaskQueue: CAS_USER_TASK_IN_LOCAL
    penReceiptCancelQueue: PEN_CANCEL_RECEIPT_IN
    dashboardManagementInQueue: DASHBOARD_MANAGEMENT_IN_LOCAL

spring.datasource:
  url: ${SPRING_DATASOURCE_URL}
  username: ${SPRING_DATASOURCE_USERNAME}
  password: ${SPRING_DATASOURCE_PASSWORD}
  type: com.zaxxer.hikari.HikariDataSource
  driver-class-name: com.mysql.cj.jdbc.Driver
  hikari:
    connectionTimeout: 30000
    idleTimeout: 600000
    maxLifetime: 1800000
    maximumPoolSize: 10
    minimumIdle: 10
    validationTimeout: 5000
    data-source-properties:
      cachePrepStmts: true
      prepStmtCacheSize: 250
      prepStmtCacheSqlLimit: 2048

jasypt:
  encryptor:
    algorithm: PBEWITHHMACSHA512ANDAES_256
    ivGeneratorClassname: org.jasypt.iv.RandomIvGenerator
    providerName: SunJCE
    password: CAPKEY

threadPool:
  paymentCartInfoSize: 10

aes.configuration:
  secretKey: ${SPRING_AES_SECRET}

beanio:
  aremaRequestBeanIOPath: "/app/data/beanioXMLMapping/SchedulerReportsBeanIO/AremaRequestBeanIO.xml"
  fpxReconBeanIOPath: "/app/data/beanioXMLMapping/SchedulerReportsBeanIO/FpxReconBeanIO.xml"

recon:
  path:
    input: "/app/data/inpath/recon/"
  file:
    financeDepartmentStatement: "Contribution Transaction"
    rhbStatement: "RHB Statement"
    autoGenFile: false

documents:
  size:
    maxFileSize: 10MB
  path:
    paymentSubmit: "/app/data/uploadfile/pay"

icoms-backoffice-api-service:
  ribbon:
    listOfServers: ${ADM_SERVICE_ENDPOINT}
    OkToRetryOnAllOperations: false

feign:
  httpclient:
    enabled: true

icoms-contribution-api-service:
  ribbon:
    listOfServers: http://icoms-cloud-contribution:8080
    OkToRetryOnAllOperations: false

sprint:
  version: 2

icoms-dms-api-service:
  ribbon:
    listOfServers: http://icoms-cloud-dms:8080
    OkToRetryOnAllOperations: false

sftp:
  enabled: false # Set to true to enable SFTP file processing, false to disable
  archiveMode: true # Set to true to move source files to archivePath after all copies to storage succeed
  stabilityCheckEnabled: true # Verify source file size+mtime are stable before copy
  stabilityCheckWaitMs: 500 # Stability window between two source stat checks
  stabilityCheckMaxRetries: 3 # Retry count when file is still changing
  connectRetryCount: 3
  connectRetryDelayMs: 1200
  serverAliveIntervalMs: 15000
  processingThreadCount: 2 # Number of CSV batches processed in parallel (set 1 to disable)

  
  # region MFT server info
  host: ${ICOMS_MFT_SFTP_HOST}
  port: ${ICOMS_MFT_SFTP_PORT}
  username: ${ICOMS_MFT_SFTP_USERNAME}
  password: ${ICOMS_MFT_SFTP_PASSWORD}
  privateKeyPath: ${ICOMS_MFT_SFTP_PRIVATE_KEY_PATH}
  privateKeyContent: ${ICOMS_MFT_SFTP_PRIVATE_KEY}
  privateKeyPassphrase: ${ICOMS_MFT_SFTP_PRIVATE_KEY_PASSPHRASE}
  # endregion MFT server info
  
  # region Timeouts
  connectTimeoutMs: 30000
  channelConnectTimeoutMs: 30000
  # endregion Timeouts
  
  # region AREMA
  aremaOutgoingLocalPath: ${AREMA_OUTGOING_LOCAL_PATH:/app/data/inpath/arema/outgoing}
  aremaIncomingLocalPath: ${AREMA_INCOMING_LOCAL_PATH:/app/data/inpath/arema/incoming}
  aremaArchiveLocalPath: ${AREMA_ARCHIVE_LOCAL_PATH:/app/data/inpath/arema/archive}
  aremaOutgoingRemotePath: ${AREMA_OUTGOING_REMOTE_PATH:Home/KWAP/OUTGOING/E-INVOICE}
  aremaIncomingRemotePath: ${AREMA_INCOMING_REMOTE_PATH:Home/KWAP/INCOMING/E-INVOICE}
  aremaArchiveRemotePath: ${AREMA_ARCHIVE_REMOTE_PATH:Home/KWAP/INCOMING/E-INVOICE/ARCHIVE}
  # endregion AREMA

  # region Finance Department
  financeDeptLocalPath: ${FINANCE_DEPT_LOCAL_PATH:/app/data/inpath/recon/}
  financeDeptArchiveLocalPath: ${FINANCE_DEPT_ARCHIVE_LOCAL_PATH:/app/data/inpath/recon/archive}
  financeDeptIncomingRemotePath: ${FINANCE_DEPT_INCOMING_REMOTE_PATH:Home/KWAP/INCOMING/FINANCEDEPT/CONTRIBUTION}
  financeDeptArchiveRemotePath: ${FINANCE_DEPT_ARCHIVE_REMOTE_PATH:Home/KWAP/INCOMING/FINANCEDEPT/CONTRIBUTION/ARCHIVE}
  # endregion Finance Department

  # region RHB
  rhbLocalPath: ${RHB_LOCAL_PATH:/app/data/inpath/recon/}
  rhbArchiveLocalPath: ${RHB_ARCHIVE_LOCAL_PATH:G:/My Drive/KWAP MH/12. Recon/1. Archive}
  rhbIncomingRemotePath: ${RHB_INCOMING_REMOTE_PATH:Home/KWAP/INCOMING/RHB/RECONCILIATION}
  rhbArchivePath: ${RHB_ARCHIVE_PATH:Home/KWAP/INCOMING/RHB/RECONCILIATION/ARCHIVE}
  fpxMaxDownloadFiles: 5
  # endregion RHB

feature:
  aremaEInvoiceEnabled: true

fpx:
  fpxVersion: "7.0"
  url:
    be: ${FPX_BE_ENDPOINT}
    ar1: ${FPX_AR_ENDPOINT}
    ae: ${FPX_AE_ENDPOINT}
    statusPagePend: ${ICOMS_PENDING_STATUS_PAGE}
  buyerBankId: "TEST0021"
  bankListParentCode : "KEY1000057"
  sellerExchangeId: ${SELLER_EXCHANGE_ID}
  sellerId: ${SELLER_ID}
  sellerBankCode: "01"
  bankListRequestMsgType: "BE"
  bankListMsgToken: "02"
  arRequestMsgType: "AR"
  arMsgToken: "02"
  trxnInquiryRequestMsgType: "AE"
  aeMsgToken: "02"
  keystore:
    name: "PKCS12"
    path: ${FPX_KEYSTORE_PATH:classpath:keystore.p12}
    password: ${FPX_KEYSTORE_PASSWORD}
    alias: ${FPX_KEYSTORE_ALIAS}
  publicKeyPath: ${FPX_PUBLIC_KEY_PATH:classpath:FPX_public_key.cer}
  signature: "SHA1withRSA"
  useLoopBackBankList: false
  recon-gen:
    outputDir: "src/main/resources/fpx"
