services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: "iso_process"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iso_process"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: iso-service-process:1.4
    ports:
      - "8080:8080"
    mem_limit: 512m
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/iso_process
      SPRING_DATASOURCE_PASSWORD:  ${POSTGRES_PASSWORD}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: